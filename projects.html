<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Ryan Baker Music Technologist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="minimalist.css">
</head>

<body>
    <div id="nav-placeholder"></div>
    <script src="loadnav.js"></script>

    <header class="hero">
        <div class="hero-content text-center">
            <h1>Projects</h1>
            <p class="hero-subtitle">Exploring Audio, DSP, Embedded Systems and Game Design</p>
        </div>
    </header>

    <div class="container">
        <div class="project-grid" id="project-grid"></div>
    </div>

    <!-- Modal Structure -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-body">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <!-- Fullscreen Game Overlay -->
    <div class="game-fullscreen-overlay" id="gameFullscreenOverlay">
        <button class="game-close-btn" id="gameCloseBtn" aria-label="Close game" title="Close">&times;</button>
        <iframe id="gameFrame" src="" title="Playable game" allow="autoplay"></iframe>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script>
        marked.setOptions({ gfm: true, breaks: false });

        function cardInnerHTML(p) {
            const btn = p.action === 'game'
                ? `<button class="play-game-btn" data-game="${p.game}">${p.cta}</button>`
                : p.action === 'link'
                    ? `<span class="read-more-btn">${p.cta}</span>`
                    : `<button class="read-more-btn" data-slug="${p.slug}">${p.cta}</button>`;
            return `
                <img src="${p.image}" alt="${p.title}">
                <div class="content">
                    <h3>${p.title}</h3>
                    <p>${p.description}</p>
                    ${btn}
                </div>`;
        }

        let projectsData = [];

        function renderProjects(projects) {
            projectsData = projects;
            const grid = document.getElementById('project-grid');
            projects.filter(p => !p.draft).forEach(p => {
                const el = document.createElement(p.action === 'link' ? 'a' : 'article');
                el.className = 'project-card-short';
                if (p.action === 'link') {
                    el.href = p.url;
                    el.target = '_blank';
                    el.rel = 'noopener';
                }
                el.innerHTML = cardInnerHTML(p);
                grid.appendChild(el);
            });
        }

        function followThroughHTML(p) {
            if (p.repo) {
                return `
                    <div class="followthrough">
                        <a class="repo-link-btn" href="${p.repo}" target="_blank" rel="noopener">View Source on GitHub &rarr;</a>
                    </div>`;
            }
            return `
                <div class="followthrough">
                    <form class="download-form" data-project="${p.title}">
                        <h4>Request a Download</h4>
                        <p class="form-hint">${p.title} isn't public yet. Drop your email and I'll follow up!</p>
                        <input type="hidden" name="project" value="${p.title}">
                        <div class="form-row">
                            <input type="text" name="name" placeholder="Name" required>
                            <input type="email" name="email" placeholder="Email" required>
                        </div>
                        <button type="submit">Request Download</button>
                        <p class="form-status"></p>
                    </form>
                </div>`;
        }

        function bindDownloadForm(root) {
            const form = root.querySelector('.download-form');
            if (!form) return;
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button');
                const status = form.querySelector('.form-status');
                btn.disabled = true;
                status.className = 'form-status';
                status.textContent = '';
                fetch('https://formspree.io/f/mjyvvloo', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: new FormData(form)
                }).then(r => {
                    if (r.ok) {
                        form.reset();
                        status.className = 'form-status success';
                        status.textContent = "Thanks! I'll be in touch.";
                    } else {
                        throw new Error('submit failed');
                    }
                }).catch(() => {
                    status.className = 'form-status error';
                    status.textContent = 'Something went wrong — please try again.';
                }).finally(() => {
                    btn.disabled = false;
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('projectModal');
            const modalBody = modal.querySelector('.modal-body');
            const closeBtn = modal.querySelector('.close-modal');

            const gameOverlay = document.getElementById('gameFullscreenOverlay');
            const gameFrame = document.getElementById('gameFrame');
            const gameCloseBtn = document.getElementById('gameCloseBtn');

            fetch('projects/projects.json')
                .then(r => r.json())
                .then(renderProjects);

            const closeGame = () => {
                gameOverlay.classList.remove('active');
                gameFrame.src = 'about:blank'; // stop gameplay/audio when closed
                document.body.style.overflow = '';
            };

            // Event Delegation for Open Modal / Play Game
            document.addEventListener('click', (e) => {
                if (e.target.matches('.play-game-btn')) {
                    gameFrame.src = e.target.dataset.game;
                    gameOverlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    return;
                }
                if (e.target.matches('.read-more-btn[data-slug]')) {
                    const slug = e.target.dataset.slug;
                    const proj = projectsData.find(p => p.slug === slug);
                    fetch('projects/' + slug + '.md')
                        .then(r => r.text())
                        .then(md => {
                            const cleaned = md.replace(/<!--[\s\S]*?-->/g, '');
                            modalBody.innerHTML = marked.parse(cleaned) + (proj ? followThroughHTML(proj) : '');
                            bindDownloadForm(modalBody);
                            modal.classList.add('active');
                            document.body.style.overflow = 'hidden'; // Prevent background scrolling
                        });
                }
            });

            gameCloseBtn.addEventListener('click', closeGame);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && gameOverlay.classList.contains('active')) {
                    closeGame();
                }
            });

            // Close Modal Function
            const closeModal = () => {
                modal.classList.remove('active');
                document.body.style.overflow = ''; // Restore scrolling
            };

            // Close on Button Click
            if (closeBtn) {
                closeBtn.addEventListener('click', closeModal);
            }

            // Close on Overlay Click
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
            }

            // Close on Escape Key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal && modal.classList.contains('active')) {
                    closeModal();
                }
            });
        });
    </script>
</body>

</html>
